<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172923">
<title>产品资料中心</title>
<style>
:root{--ink:#172923;--muted:#68756f;--line:#e4e9e5;--accent:#477b61;--bg:#f4f6f3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:42px 20px 56px}
header{background:var(--ink);color:#fff;border-radius:18px;padding:30px 28px;margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:2.5px;color:#b8c9bf;margin-bottom:13px}
h1{font-size:27px;line-height:1.3;margin:0 0 9px;font-weight:650}
.sub{font-size:13px;color:#d0dbd4;line-height:1.7}
.section{font-size:12px;letter-spacing:1.5px;color:var(--muted);margin:26px 2px 12px}
.file{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;display:flex;gap:15px;align-items:center;margin:11px 0}
.pdf{width:44px;height:48px;flex:0 0 44px;border-radius:9px;background:#fbeeed;color:#c44b43;display:grid;place-items:center;font-size:12px;font-weight:700}
.info{min-width:0;flex:1}.name{font-size:15px;font-weight:650;line-height:1.5;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
a.btn{font-size:12px;text-decoration:none;border-radius:7px;padding:8px 13px;font-weight:600}
.preview{background:var(--ink);color:#fff}.download{border:1px solid #d8e0da;color:var(--ink)}
footer{text-align:center;color:#87928b;font-size:11px;margin-top:30px;line-height:1.8}
@media(max-width:520px){.wrap{padding:22px 14px 36px}header{padding:25px 21px}h1{font-size:23px}.file{padding:15px;gap:12px}.pdf{width:39px;height:44px;flex-basis:39px}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div class="eyebrow">DOCUMENTATION CENTER</div>
  <h1>产品资料中心</h1>
  <div class="sub">设备说明书与技术支持文档<br>选择所需文件，即可在线预览或下载。</div>
</header>
<div class="section">资料文件 / DOCUMENTS</div>
<section class="file">
  <div class="pdf">PDF</div>
  <div class="info">
    <div class="name">AK650 操作说明书</div>
    <div class="meta">立式五轴加工中心 · 机械说明书</div>
    <div class="actions">
      <a class="btn preview" href="pdf/AK650%E6%93%8D%E4%BD%9C%E8%AF%B4%E6%98%8E%E4%B9%A6.pdf" target="_blank" rel="noopener">在线预览</a>
      <a class="btn download" href="pdf/AK650%E6%93%8D%E4%BD%9C%E8%AF%B4%E6%98%8E%E4%B9%A6.pdf" download>下载 PDF</a>
    </div>
  </div>
</section>
<section class="file">
  <div class="pdf">PDF</div>
  <div class="info">
    <div class="name">HAUX 数控系统 PLC 故障排查手册</div>
    <div class="meta">AK650 适配版 · 机床用户版</div>
    <div class="actions">
      <a class="btn preview" href="pdf/HAUX%E6%95%B0%E6%8E%A7%E7%B3%BB%E7%BB%9FPLC%E6%95%85%E9%9A%9C%E6%8E%92%E6%9F%A5%E6%89%8B%E5%86%8C.pdf" target="_blank" rel="noopener">在线预览</a>
      <a class="btn download" href="pdf/HAUX%E6%95%B0%E6%8E%A7%E7%B3%BB%E7%BB%9FPLC%E6%95%85%E9%9A%9C%E6%8E%92%E6%9F%A5%E6%89%8B%E5%86%8C.pdf" download>下载 PDF</a>
    </div>
  </div>
</section>
<footer>请以设备现场实际配置及正式技术文件为准。</footer>
</main>
</body>
</html>
